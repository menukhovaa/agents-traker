<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой учебный трекер</title>
  <style>
    :root {
      --bg: #f5f6fb;
      --surface: #ffffff;
      --text: #20243a;
      --muted: #72788d;
      --accent: #6458dc;
      --accent-light: #eeecff;
      --border: #e7e9f1;
      --shadow: 0 10px 35px rgba(30, 35, 75, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    .container { width: min(100% - 32px, 820px); margin: 48px auto; }
    header { margin-bottom: 28px; }
    h1 { margin: 0; font-size: clamp(26px, 5vw, 36px); letter-spacing: -.8px; }
    .subtitle { color: var(--muted); margin: 8px 0 0; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
    .stat, .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .stat { padding: 20px; }
    .stat-label { color: var(--muted); font-size: 13px; margin-bottom: 7px; }
    .stat-value { font-size: 30px; font-weight: 750; line-height: 1.2; }
    .stat-unit { font-size: 14px; color: var(--muted); font-weight: 400; }
    .panel { padding: 24px; margin-bottom: 20px; }
    h2 { font-size: 19px; margin: 0 0 18px; }
    .progress-info {
      display: flex; justify-content: space-between; gap: 12px;
      margin-bottom: 12px; font-size: 14px; color: var(--muted);
    }
    .progress-track { height: 12px; background: var(--accent-light); border-radius: 20px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 20px; transition: width .25s ease; }
    .form-grid { display: grid; grid-template-columns: 1fr 130px auto; gap: 12px; align-items: end; }
    .field label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 7px; }
    input[type="text"], input[type="number"] {
      width: 100%; min-height: 44px; border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; font: inherit;
      color: var(--text); background: white;
    }
    input:focus-visible, button:focus-visible { outline: 3px solid #a9a2ff; outline-offset: 2px; }
    button { font: inherit; cursor: pointer; }
    .add-btn {
      min-height: 44px; padding: 10px 20px; background: var(--accent);
      color: white; border: 0; border-radius: 10px; font-weight: 650;
    }
    .add-btn:hover { background: #5045c3; }
    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
    }
    .section-header h2 { margin: 0; }
    .filters { display: flex; gap: 5px; background: var(--bg); padding: 4px; border-radius: 11px; }
    .filter-btn {
      padding: 7px 12px; background: transparent; border: 0;
      border-radius: 8px; color: var(--muted); font-size: 13px;
    }
    .filter-btn[aria-pressed="true"] {
      background: white; color: var(--accent); font-weight: 700;
      box-shadow: 0 1px 5px rgba(0,0,0,.06);
    }
    .task-list { list-style: none; padding: 0; margin: 0; }
    .task { display: flex; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .task:last-child { border-bottom: 0; }
    .task-label { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
    .task-checkbox { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
    .task-title { overflow-wrap: anywhere; font-weight: 550; }
    .task.done .task-title { text-decoration: line-through; color: var(--muted); }
    .hours {
      flex-shrink: 0; padding: 5px 10px; background: var(--accent-light);
      color: var(--accent); border-radius: 8px; font-size: 13px; font-weight: 650;
    }
    .delete-btn {
      flex-shrink: 0; background: transparent; border: 0; color: #a4a7b5;
      font-size: 22px; border-radius: 8px; padding: 3px 9px;
    }
    .delete-btn:hover { color: #cf4658; background: #fff0f1; }
    .empty { text-align: center; color: var(--muted); padding: 32px 10px; }
    .footer { color: var(--muted); font-size: 12px; text-align: center; margin: 22px 0; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      .container { margin: 24px auto; }
      .stats { gap: 8px; }
      .stat { padding: 14px 10px; }
      .stat-value { font-size: 23px; }
      .panel { padding: 18px; }
      .form-grid { grid-template-columns: 1fr 110px; }
      .add-btn { grid-column: 1 / -1; }
      .section-header { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Мой учебный трекер</h1>
      <p class="subtitle">Планируйте занятия и отслеживайте прогресс.</p>
    </header>
    <section class="stats" aria-label="Статистика">
      <div class="stat">
        <div class="stat-label">Всего часов</div>
        <div class="stat-value"><span id="total-hours">0</span> <span class="stat-unit">ч</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Выполнено</div>
        <div class="stat-value"><span id="done-hours">0</span> <span class="stat-unit">ч</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Прогресс</div>
        <div class="stat-value"><span id="percent">0</span> <span class="stat-unit">%</span></div>
      </div>
    </section>
    <section class="panel" aria-label="Прогресс задач">
      <div class="progress-info">
        <span id="progress-text">Выполнено 0 из 0 задач</span>
        <span id="remaining-text">Осталось 0 ч</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="Процент выполненных задач"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>
    <section class="panel">
      <h2>Добавить задачу</h2>
      <form id="task-form" class="form-grid">
        <div class="field">
          <label for="task-name">Название задачи</label>
          <input type="text" id="task-name" placeholder="Например, изучить лекцию" maxlength="100" required>
        </div>
        <div class="field">
          <label for="task-hours">Часы</label>
          <input type="number" id="task-hours" min="0.25" max="100000" step="0.25" value="1" required>
        </div>
        <button type="submit" class="add-btn">+ Добавить</button>
      </form>
    </section>
    <section class="panel">
      <div class="section-header">
        <h2>Мои задачи</h2>
        <div class="filters" aria-label="Фильтр задач">
          <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">Все</button>
          <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Активные</button>
          <button class="filter-btn" type="button" data-filter="done" aria-pressed="false">Готовые</button>
        </div>
      </div>
      <ul class="task-list" id="task-list"></ul>
      <div class="empty" id="empty-message" hidden>Здесь пока нет задач.</div>
    </section>
    <p class="footer">Данные сохраняются локально в вашем браузере.</p>
  </main>
  <script>
    "use strict";

    const STORAGE_KEY = "study-tracker-v1";
    const initialTasks = [
      { id: "example-1", title: "Чтение", hours: 2, done: true },
      { id: "example-2", title: "Практика", hours: 4, done: false },
      { id: "example-3", title: "Повторение", hours: 2, done: false }
    ];

    const form = document.getElementById("task-form");
    const nameInput = document.getElementById("task-name");
    const hoursInput = document.getElementById("task-hours");
    const taskList = document.getElementById("task-list");
    const emptyMessage = document.getElementById("empty-message");

    let filter = "all";
    let tasks = loadTasks();
    const numberFormat = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 });

    function loadTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === null) return initialTasks.map(task => ({ ...task }));
        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed)) throw new Error("Некорректные данные");
        return parsed.filter(task =>
          task &&
          typeof task.id === "string" &&
          typeof task.title === "string" &&
          typeof task.hours === "number" &&
          Number.isFinite(task.hours) &&
          task.hours > 0 &&
          typeof task.done === "boolean"
        );
      } catch (error) {
        console.warn("Не удалось загрузить задачи:", error);
        return initialTasks.map(task => ({ ...task }));
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (error) {
        console.warn("Не удалось сохранить задачи:", error);
      }
    }

    function formatHours(value) { return numberFormat.format(value); }
    function createId() {
      if (window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function updateStats() {
      const totalHours = tasks.reduce((sum, task) => sum + task.hours, 0);
      const doneTasks = tasks.filter(task => task.done);
      const doneHours = doneTasks.reduce((sum, task) => sum + task.hours, 0);
      const percent = tasks.length ? Math.round(doneTasks.length / tasks.length * 100) : 0;
      const remainingHours = Math.max(0, totalHours - doneHours);

      document.getElementById("total-hours").textContent = formatHours(totalHours);
      document.getElementById("done-hours").textContent = formatHours(doneHours);
      document.getElementById("percent").textContent = percent;
      document.getElementById("progress-text").textContent =
        `Выполнено ${doneTasks.length} из ${tasks.length} задач`;
      document.getElementById("remaining-text").textContent =
        `Осталось ${formatHours(remainingHours)} ч`;
      document.getElementById("progress-fill").style.width = `${percent}%`;
      document.getElementById("progress-track").setAttribute("aria-valuenow", String(percent));
    }

    function createTaskElement(task) {
      const li = document.createElement("li");
      li.className = task.done ? "task done" : "task";
      const label = document.createElement("label");
      label.className = "task-label";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "task-checkbox";
      checkbox.checked = task.done;
      checkbox.addEventListener("change", () => {
        task.done = checkbox.checked;
        saveTasks();
        render();
      });
      const title = document.createElement("span");
      title.className = "task-title";
      title.textContent = task.title;
      label.append(checkbox, title);

      const hours = document.createElement("span");
      hours.className = "hours";
      hours.textContent = `${formatHours(task.hours)} ч`;
      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "delete-btn";
      deleteButton.textContent = "×";
      deleteButton.setAttribute("aria-label", `Удалить задачу «${task.title}»`);
      deleteButton.title = "Удалить задачу";
      deleteButton.addEventListener("click", () => {
        tasks = tasks.filter(item => item.id !== task.id);
        saveTasks();
        render();
      });
      li.append(label, hours, deleteButton);
      return li;
    }

    function render() {
      taskList.replaceChildren();
      let visibleTasks = tasks;
      if (filter === "active") visibleTasks = tasks.filter(task => !task.done);
      else if (filter === "done") visibleTasks = tasks.filter(task => task.done);
      visibleTasks.forEach(task => taskList.appendChild(createTaskElement(task)));
      emptyMessage.hidden = visibleTasks.length !== 0;
      if (visibleTasks.length === 0) {
        emptyMessage.textContent = filter === "active"
          ? "Активных задач нет."
          : filter === "done" ? "Пока нет выполненных задач." : "Задач пока нет. Добавьте первую!";
      }
      document.querySelectorAll(".filter-btn").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
      });
      updateStats();
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const title = nameInput.value.trim();
      const hours = Number(hoursInput.value);
      if (!title || !Number.isFinite(hours) || hours < 0.25 || hours > 100000) return;
      tasks.push({ id: createId(), title, hours, done: false });
      saveTasks();
      filter = "all";
      render();
      form.reset();
      hoursInput.value = "1";
      nameInput.focus();
    });

    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => {
        filter = button.dataset.filter;
        render();
      });
    });

    render();
  </script>
</body>
</html>
